<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09111f" />
    <link rel="icon" href="data:," />
    <title>Solivate Studio — Pricing Master 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="deck" aria-live="polite">
      <section id="slide" class="slide"></section>
    </main>

    <div class="topbar">
      <img class="brand" src="assets/solivate_logo.png" alt="Solivate Studio" />
      <div class="topbar-meta">
        <span id="chapter">01 / SYSTEM</span>
        <button id="catalogueOpen" type="button" aria-label="Buka katalog detail">KATALOG DETAIL</button>
        <button id="fullscreen" type="button" aria-label="Layar penuh">LAYAR PENUH</button>
      </div>
    </div>

    <div class="hud">
      <div class="progress-track"><span id="progress"></span></div>
      <div class="hud-row">
        <div id="chapters" class="chapter-nav"></div>
        <div class="nav-controls" aria-label="Navigasi slide">
          <button id="prev" type="button" aria-label="Slide sebelumnya"><span>←</span> KEMBALI</button>
          <button id="next" type="button" aria-label="Slide berikutnya">LANJUT <span>→</span></button>
        </div>
        <div id="counter" class="counter">01 / 16</div>
      </div>
    </div>

    <section id="catalogueOverlay" class="catalogue-overlay" aria-hidden="true" aria-label="Katalog detail paket">
      <div class="catalogue-shell">
        <header class="catalogue-header">
          <div>
            <span class="catalogue-kicker">SOLIVATE STUDIO • INTERNAL REFERENCE</span>
            <h2>Katalog Detail Paket</h2>
          </div>
          <div class="catalogue-header-actions">
            <span id="catalogueCount">64 PAKET</span>
            <button id="catalogueClose" type="button" aria-label="Tutup katalog">TUTUP <b>×</b></button>
          </div>
        </header>
        <div class="catalogue-body">
          <aside class="catalogue-sidebar">
            <label class="catalogue-search">
              <span>CARI PAKET</span>
              <input id="catalogueSearch" type="search" placeholder="Contoh: ERP, QR, booking…" autocomplete="off" />
            </label>
            <div id="catalogueFilters" class="catalogue-filters" aria-label="Filter kategori"></div>
            <div id="catalogueList" class="catalogue-list"></div>
          </aside>
          <main id="catalogueDetail" class="catalogue-detail" aria-live="polite"></main>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <script src="catalogue-data.js"></script>
    <script src="presentation.js"></script>
  </body>
</html>
