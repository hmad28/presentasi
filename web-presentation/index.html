<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <meta name="description" content="Solivate Studio Pricing Master 2026 — presentasi dan katalog harga internal." />
    <link rel="icon" href="data:," />
    <title>Solivate Studio — Pricing Master 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="deck" aria-live="polite">
      <section id="slide" class="slide"></section>
    </main>

    <header class="topbar">
      <button class="brand-button" id="goHome" type="button" aria-label="Ke slide pertama">
        <img src="assets/solivate_logo.png" alt="Solivate Studio" />
      </button>
      <div class="topbar-meta">
        <span id="chapter">01 · PATOKAN</span>
        <button class="utility-button" id="catalogueOpen" type="button">BUKA KATALOG</button>
        <button class="utility-button ghost" id="fullscreen" type="button">LAYAR PENUH</button>
      </div>
    </header>

    <footer class="hud">
      <div class="progress-track"><span id="progress"></span></div>
      <div class="hud-row">
        <nav id="chapters" class="chapter-nav" aria-label="Bab presentasi"></nav>
        <div class="nav-controls" aria-label="Navigasi slide">
          <button id="prev" type="button" aria-label="Slide sebelumnya">← <span>KEMBALI</span></button>
          <button id="next" type="button" aria-label="Slide berikutnya"><span>LANJUT</span> →</button>
        </div>
        <div id="counter" class="counter">01 / 80</div>
      </div>
    </footer>

    <section id="catalogueOverlay" class="catalogue-overlay" aria-hidden="true" aria-label="Katalog paket lengkap">
      <div class="catalogue-page">
        <header class="catalogue-header">
          <div class="catalogue-title">
            <span>REFERENSI INTERNAL · 64 PAKET</span>
            <h2>Katalog lengkap</h2>
            <p>Pilih paket untuk melihat outcome, cakupan, demo, dan pembeda tier.</p>
          </div>
          <button id="catalogueClose" class="catalogue-close" type="button" aria-label="Tutup katalog">TUTUP <b>×</b></button>
        </header>

        <div class="catalogue-tools">
          <label class="catalogue-search">
            <span>CARI</span>
            <input id="catalogueSearch" type="search" placeholder="Nama paket, capability, atau demo…" autocomplete="off" />
          </label>
          <div id="catalogueFilters" class="catalogue-filters" aria-label="Filter kategori"></div>
        </div>

        <div class="catalogue-summary">
          <p id="catalogueCount">64 paket ditemukan</p>
          <p>Klik satu paket untuk membuka detail.</p>
        </div>
        <div id="catalogueGrid" class="catalogue-grid"></div>
      </div>

      <aside id="packageDrawer" class="package-drawer" aria-hidden="true" aria-label="Detail paket">
        <button id="drawerClose" class="drawer-close" type="button" aria-label="Tutup detail paket">×</button>
        <div id="drawerContent" class="drawer-content"></div>
      </aside>
      <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="Tutup detail paket"></button>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <script src="catalogue-data.js"></script>
    <script src="live-examples.js"></script>
    <script src="presentation.js"></script>
  </body>
</html>
