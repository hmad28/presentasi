<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09111f" />
    <link rel="icon" href="data:," />
    <title>Solivate Studio — Pricing Master 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="deck" aria-live="polite">
      <section id="slide" class="slide"></section>
    </main>

    <div class="topbar">
      <img class="brand" src="assets/solivate_logo.png" alt="Solivate Studio" />
      <div class="topbar-meta">
        <span id="chapter">01 / SYSTEM</span>
        <button id="fullscreen" type="button" aria-label="Fullscreen">FULLSCREEN</button>
      </div>
    </div>

    <div class="hud">
      <div class="progress-track"><span id="progress"></span></div>
      <div class="hud-row">
        <div id="chapters" class="chapter-nav"></div>
        <div id="counter" class="counter">01 / 83</div>
      </div>
    </div>

    <div id="gestureHint" class="gesture-hint">
      <span><b>LEFT CLICK</b> BACK</span>
      <i></i>
      <span><b>RIGHT CLICK</b> NEXT</span>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="presentation.js"></script>
  </body>
</html>
