<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="description" content="Solivate Studio Pricing Master Simplified 2026 — katalog 21 paket dan framework quotation." />
    <link rel="icon" href="data:," />
    <title>Solivate Studio — Pricing Master Simplified 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="deck" aria-live="polite">
      <section id="slide" class="slide"></section>
    </main>

    <header class="topbar">
      <button id="goHome" class="brand" type="button" aria-label="Kembali ke halaman pertama">
        <img src="assets/solivate_logo.png" alt="Solivate Studio" />
      </button>
      <div class="topbar-center">
        <span id="chapterNumber">00</span>
        <strong id="chapterName">PEMBUKA</strong>
      </div>
      <div class="topbar-actions">
        <button id="openCatalogue" type="button">21 PAKET</button>
        <button id="fullscreen" class="icon-button" type="button" aria-label="Layar penuh">⛶</button>
      </div>
    </header>

    <footer class="bottom-bar">
      <div class="progress"><span id="progress"></span></div>
      <div class="bottom-content">
        <nav id="chapterNav" class="chapter-nav" aria-label="Navigasi kategori"></nav>
        <div class="slide-actions">
          <button id="prev" type="button" aria-label="Halaman sebelumnya"><b>←</b><span>KEMBALI</span></button>
          <span id="counter">01 / 39</span>
          <button id="next" type="button" aria-label="Halaman berikutnya"><span>LANJUT</span><b>→</b></button>
        </div>
      </div>
    </footer>

    <section id="catalogue" class="catalogue" aria-hidden="true">
      <div class="catalogue-shell">
        <header class="catalogue-header">
          <div>
            <span>PRICING MASTER SIMPLIFIED 2026</span>
            <h2>21 paket. Lebih mudah dipilih.</h2>
          </div>
          <button id="closeCatalogue" type="button">TUTUP <b>×</b></button>
        </header>
        <div class="catalogue-tools">
          <label><span>CARI</span><input id="search" type="search" placeholder="Cari paket, kebutuhan, atau harga…" /></label>
          <div id="filters" class="filters"></div>
        </div>
        <div id="catalogueGrid" class="catalogue-grid"></div>
      </div>
    </section>

    <section id="detailLayer" class="detail-layer" aria-hidden="true">
      <button id="detailBackdrop" class="detail-backdrop" type="button" aria-label="Tutup detail"></button>
      <article class="detail-panel">
        <button id="closeDetail" class="close-detail" type="button" aria-label="Tutup detail">×</button>
        <div id="detailContent"></div>
      </article>
    </section>

    <script src="catalogue-data.js"></script>
    <script src="live-examples.js"></script>
    <script src="presentation.js"></script>
  </body>
</html>
